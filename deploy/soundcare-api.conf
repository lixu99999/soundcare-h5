upstream soundcare {
      server 127.0.0.1:8002;
  }

  server {
    if ($host = api.collegegenerator.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


      listen 80;
      server_name api.collegegenerator.cn;

      return 301 https://$server_name$request_uri;


}

  server {
      listen 443 ssl;
      server_name api.collegegenerator.cn;
    ssl_certificate /etc/letsencrypt/live/api.collegegenerator.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.collegegenerator.cn/privkey.pem; # managed by Certbot
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

      location / {
          proxy_pass http://soundcare;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # 长请求超时(Suno 音乐生成 2-3 分钟,nginx 默认 60s 会切断并返回 504 不带 CORS 头)
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_connect_timeout 10s;
      }

}
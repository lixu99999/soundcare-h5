# SoundCare H5 - Nginx vhost
#
# 部署步骤:
#   1. 本地保存到 C:\Users\lixu\soundcare.conf
#   2. scp 到 ECS:
#      scp /mnt/c/Users/lixu/soundcare.conf xuli@39.106.146.12:/tmp/soundcare.conf
#   3. SSH 到 ECS (Debian 模式,放在 sites-available):
#      sudo cp /tmp/soundcare.conf /etc/nginx/sites-available/soundcare_frontend
#      sudo ln -sf /etc/nginx/sites-available/soundcare_frontend \
#                    /etc/nginx/sites-enabled/soundcare_frontend
#      sudo nginx -t && sudo systemctl reload nginx
#
# 前提:
#   1. 证书已签发(SAN 含 soundcare.collegegenerator.cn),路径:
#      /etc/letsencrypt/live/api.collegegenerator.cn/fullchain.pem
#      (certbot --expand 把现有 api cert 原地扩展为 4 域名,未新建目录)
#   2. 后端 FastAPI 在 https://api.collegegenerator.cn/api/v1,CORS 已加 origin
#   3. 前端构建产物已 rsync 到 /var/www/soundcare-h5/dist/

server {
    listen 443 ssl http2;
    server_name soundcare.collegegenerator.cn;

    ssl_certificate     /etc/letsencrypt/live/api.collegegenerator.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.collegegenerator.cn/privkey.pem;

    # SSL 优化(options-ssl-nginx.conf 已包含 ssl_protocols/ciphers/session 等,
    # 所以不 include 它,避免 duplicate directive)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 根目录 - 前端构建产物
    root /var/www/soundcare-h5/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # ===== 前端 SPA(history 路由 fallback) =====
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # ===== 静态资源长缓存(Vite hash 文件) =====
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== favicon 不缓存,避免浏览器卡死旧 icon =====
    location = /favicon.svg {
        expires 1h;
        access_log off;
    }
}

# HTTP → HTTPS 重定向(certbot 验证文件例外)
server {
    listen 80;
    server_name soundcare.collegegenerator.cn;

    # certbot HTTP-01 挑战验证用,必须留
    location /.well-known/acme-challenge/ {
        root /var/www/soundcare-h5;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}